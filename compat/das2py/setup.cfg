# See pyproject.toml for why the metadata lives here.

[metadata]
name = das2py
version = 3.0.6rc1
description = Renamed to das3py; this transitional package installs it
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = C Piker
author_email = cpiker@users.noreply.github.com
maintainer = K Steele
maintainer_email = KaiwenS7@users.noreply.github.com
keywords = space-physics, magnetosphere, das2, das3
url = https://github.com/das-developers/das3py
project_urls =
	Repository = https://github.com/das-developers/das3py

[options]
packages = das2
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*
# A pre-release in the specifier makes pip willing to take das3py
# pre-releases for this requirement.  Drop the rc suffix for the final.
#
# The upper limit is deliberate and permanent.  This is meant to be the
# last das2py release, so the line below is fixed for good, and das3py
# 3.1 is where the das2py 2.3 names old scripts call are removed
# (protoGet, from_string, round_doy, propEq ...).  Without the limit,
# pip would hand das2py users that release and break them.  With it they
# stay on das3py 3.0.x, which still gets bug fixes.  There is no das3py
# 4.0 to wait for: the major number is the das stream version.
install_requires =
	das3py>=3.0.6rc1,<3.1

# One py2.py3-none-any wheel.  A py3-only tag would send python 2 pip to
# the sdist instead.  python_tag is used rather than 'universal', which
# setuptools has deprecated.
[bdist_wheel]
python_tag = py2.py3
