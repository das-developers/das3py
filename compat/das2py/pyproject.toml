# Transitional distribution: das2py was renamed das3py at 3.0.5.  This
# package carries only the 'import das2' alias and pulls in das3py, so that
# 'pip install -U das2py' lands old users on the new code, and so the das2py
# PyPI page (which shows the newest release's README) points at das3py.
#
# Build from the repository root as:  python -m build compat/das2py
#
# The metadata is in setup.cfg, not a [project] table here.  setuptools 44,
# the last release for python 2.7, ignores [project] and would build a
# package named UNKNOWN; declarative setup.cfg is read by old and new alike.

[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"
